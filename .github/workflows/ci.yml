# CI: the full test suite plus the gold-answer eval on every push and PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test suite
        run: npx vitest run

      - name: Gold-answer eval (100% category accuracy, 0 false positives, or fail)
        run: node --experimental-strip-types eval/run.ts
